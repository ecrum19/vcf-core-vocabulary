name: Validate vocabulary and examples

# The SHACL suite takes about three minutes, and most pull requests touch the
# README or generated site rather than the vocabulary. Path filters keep CI off
# those changes; when the job does run it runs the full suite with
# validate:force, so a stale committed stamp can never suppress a real check.
on:
  pull_request:
    paths:
      - 'ontology/**'
      - 'shacl/**'
      - 'examples/**'
      - 'mappings/**'
      - 'tests/**'
      - 'scripts/**'
      - 'coverage/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-dev.txt'
      - 'ocg.config.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate vocabulary, profiles, examples and regression probes
        run: npm run validate:force && npx ocg check

      - name: Fail if the committed validation stamp is out of date
        run: |
          if ! git diff --quiet -- tests/.validation-stamp.json; then
            echo "::error::tests/.validation-stamp.json is stale. Run 'npm run validate:force' and commit the updated stamp."
            git --no-pager diff -- tests/.validation-stamp.json
            exit 1
          fi
